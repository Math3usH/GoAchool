  <script>
    // Fila de chamadas enquanto o Maps ainda não carregou
    window._mapsReady = false;
    window._mapsQueue = [];

    function initGoSchoolMaps() {
      window._mapsReady = true;
      window._mapsQueue.forEach(fn => fn());
      window._mapsQueue = [];
    }

    teste

    // Chamado pelo Dart via JS interop — sem CORS, roda no browser
    function goschoolGetDirections(originLat, originLng, destLat, destLng, waypointsJson, callback) {
      function doRoute() {
        const service = new google.maps.DirectionsService();
        const waypoints = JSON.parse(waypointsJson).map(w => ({
          location: new google.maps.LatLng(w.lat, w.lng),
          stopover: true
        }));
        service.route({
          origin: new google.maps.LatLng(originLat, originLng),
          destination: new google.maps.LatLng(destLat, destLng),
          waypoints: waypoints,
          travelMode: google.maps.TravelMode.DRIVING,
          optimizeWaypoints: true
        }, function(result, status) {
          if (status === 'OK') {
            var points = [];
            result.routes[0].legs.forEach(function(leg) {
              leg.steps.forEach(function(step) {
                step.path.forEach(function(p) {
                  points.push({ lat: p.lat(), lng: p.lng() });
                });
              });
            });
            callback(JSON.stringify(points));
          } else {
            console.warn('Directions status:', status);
            callback('[]');
          }
        });
      }

      if (window._mapsReady) {
        doRoute();
      } else {
        window._mapsQueue.push(doRoute);
      }
    }
  </script>
